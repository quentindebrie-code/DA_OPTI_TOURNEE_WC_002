  <section id="login" class="login" hidden>
    <form id="login-form" class="glass login-card" novalidate>
      <div class="logo-slot"></div>
      <h1>Bonjour</h1>
      <p class="lead">Connectez-vous pour préparer vos tournées.</p>
      <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
      <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="note err" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Se connecter</button>
      <button class="btn-link" type="button" id="forgot">Mot de passe oublié ?</button>
    </form>
    <form id="newpwd-form" class="glass login-card" hidden>
      <div class="logo-slot"></div>
      <h1>Nouveau mot de passe</h1>
      <label>Mot de passe (8 caractères minimum)<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
      <p class="note err" id="newpwd-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Enregistrer</button>
    </form>
  </section>
